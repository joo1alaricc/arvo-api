<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>404 · Halaman tidak ditemukan | Arvo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'dark'}catch(e){}</script>
<style>
:root{--bg:#0d1016;--card:#151a23;--line:#242b38;--tx:#e8ecf3;--mut:#8b95a7;--ac:#7c8cff;--acx:#0d1016;--ok:#3ecf8e;--bad:#ff6b7a;--warn:#f5a524;--ease:cubic-bezier(.22,1,.36,1);color-scheme:dark}
[data-theme=light]{--bg:#f4f6fb;--card:#fff;--line:#e0e4ee;--tx:#141821;--mut:#5c6678;--ac:#4350d8;--acx:#fff;--bad:#e5484d;--warn:#c77d0a;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.6 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;animation:pageIn .4s var(--ease) both;transition:background-color .25s,color .25s}
a{color:inherit}
@keyframes pageIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* header: sama seperti bar atas situs */
.nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 52%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(24px);backdrop-filter:saturate(1.8) blur(24px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.nav-in{max-width:980px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:8px;height:52px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;text-decoration:none;letter-spacing:-.01em}
.logo{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),#e16bff);color:#fff;transition:transform .3s var(--ease)}
.logo svg{width:72%;height:auto;fill:currentColor}.brand:hover .logo{transform:rotate(-8deg)}
.sp{flex:1}
.nb{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--tx);display:grid;place-items:center;cursor:pointer;transition:background-color .2s,transform .15s var(--ease)}
.nb:hover{background:color-mix(in srgb,var(--mut) 12%,transparent)}.nb:active{transform:scale(.92)}
.nb svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* isi */
main{flex:1;position:relative;display:grid;place-items:center;padding:40px 16px;overflow:hidden}
main::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(55% 45% at 50% 42%,color-mix(in srgb,var(--tone) 16%,transparent),transparent 70%),linear-gradient(color-mix(in srgb,var(--tx) 5%,transparent) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,color-mix(in srgb,var(--tx) 5%,transparent) 1px,transparent 1px) 0 0/44px 44px;-webkit-mask-image:radial-gradient(70% 60% at 50% 45%,#000,transparent 85%);mask-image:radial-gradient(70% 60% at 50% 45%,#000,transparent 85%)}
.box{position:relative;width:min(100%,460px);text-align:center;display:grid;justify-items:center;gap:14px;animation:rise .6s var(--ease) both}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:color-mix(in srgb,var(--card) 80%,transparent);font-size:12.5px;font-weight:600;color:var(--mut)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--tone);box-shadow:0 0 0 3px color-mix(in srgb,var(--tone) 25%,transparent)}
.code{font-size:clamp(88px,26vw,150px);font-weight:800;line-height:.95;letter-spacing:-.05em;background:linear-gradient(135deg,var(--tone),color-mix(in srgb,var(--tone) 40%,#e16bff));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 10px 30px color-mix(in srgb,var(--tone) 35%,transparent));animation:float 5s ease-in-out infinite}
h1{font-size:clamp(22px,5.5vw,28px);letter-spacing:-.02em;line-height:1.2}
.desc{color:var(--mut);max-width:380px;font-size:14.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.btn{background:var(--ac);color:var(--acx);border:1px solid var(--ac);padding:10px 18px;border-radius:10px;font:600 13.5px/1.2 inherit;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .15s var(--ease),box-shadow .2s,filter .2s,background-color .2s,opacity .2s}
.btn:hover{filter:brightness(1.08);box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 28%,transparent)}.btn:active{transform:scale(.96)}
.btn.ghost{background:none;color:var(--tx);border-color:var(--line);box-shadow:none}.btn.ghost:hover{background:color-mix(in srgb,var(--mut) 12%,transparent);filter:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;filter:none}
.cd{width:min(100%,320px);display:grid;gap:8px;margin-top:2px}
.cd-top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--mut)}.cd-top b{color:var(--tx);font-variant-numeric:tabular-nums;font-family:'JetBrains Mono',monospace;font-weight:500}
.cd-track{height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.cd-bar{display:block;height:100%;width:100%;border-radius:inherit;background:linear-gradient(90deg,var(--ac),#e16bff);transform-origin:left;transition:transform 1s linear}
footer{border-top:1px solid var(--line);padding:16px;text-align:center;color:var(--mut);font-size:12.5px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body style="--tone:var(--ac)">
<header class="nav"><div class="nav-in">
  <a class="brand" href="/"><span class="logo"><svg viewBox="-4 -4 108 78.9" aria-hidden="true"><path d="M40.6 0.5L0.1 70.9L14.2 70.9L40.5 25.6L41.7 27.3L56.0 27.3ZM49.3 0.0L56.4 12.5L85.2 12.4L85.5 12.9L72.7 34.9L43.4 34.9L36.3 47.3L53.1 47.4L66.8 70.9L81.1 70.9L67.9 47.5L80.1 47.2L100.0 12.4L92.8 0.0Z"/></svg></span>Arvo</a>
  <span class="sp"></span>
  <button class="nb" id="theme" type="button" aria-label="Ganti tema"></button>
</div></header>
<main><div class="box">
  <span class="pill"><i></i>Tidak ditemukan</span>
  <div class="code" aria-label="Error 404">404</div>
  <h1>Halaman tidak ditemukan</h1>
  <p class="desc">Halaman yang kamu cari tidak ada. Mungkin sudah dipindah atau alamatnya salah ketik.</p>
  <div class="row"><a class="btn" href="/">Kembali ke beranda</a><button class="btn ghost" type="button" onclick="history.length>1?history.back():location.href='/'">Halaman sebelumnya</button></div>
</div></main>
<footer>© 2026 Arvo · All rights reserved.</footer>
<script>
(function(){var r=document.documentElement,b=document.getElementById('theme');
var SUN='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',MOON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
var sync=function(){b.innerHTML=r.dataset.theme==='dark'?SUN:MOON};
b.onclick=function(){r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('theme',r.dataset.theme)}catch(e){}sync()};sync()})();

</script>
</body>
</html>
