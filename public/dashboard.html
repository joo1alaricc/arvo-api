<!DOCTYPE html>
<html lang="id" data-theme="dark"><head><meta charset="UTF-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · Arvo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=147e4455"><link rel="stylesheet" href="app.css?v=cdcedff2"><link rel="stylesheet" href="motion.css?v=091a8e42"></head>
<body><main class="dash" id="app">
  <h1>Dashboard</h1><p class="sub">Statistik Arvo secara langsung. Diperbarui otomatis tiap 30 detik.</p>
  <div class="stats" id="stats"></div>
  <div class="dash-grid dg2">
    <div class="card"><div class="card-h"><span id="sii"></span>Status &amp; Info API</div><div class="card-b" id="si"><p class="empty">Memuat…</p></div></div>
    <div class="card"><div class="card-h"><span id="cki"></span>Cek Apikey</div><div class="card-b">
      <div class="ck-c">
        <select id="ckt" aria-label="Tipe kunci"><option value="apikey">API Key (default)</option><option value="accesskey">Access Key (admin/owner)</option></select>
        <div class="ck-r"><input id="ckk" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="arvo_xxxxxxxx" aria-label="API Key"><button class="btn go" id="ckb" type="button">Submit</button></div>
      </div>
      <div class="msg" id="ckm"></div>
      <div id="mykey" hidden></div>
    </div></div>
  </div>
  <div id="ckr"></div>
  <div class="card"><div class="card-h"><span id="rmi"></span>Request Metrics<span class="lock" style="margin-left:auto">14 hari</span></div><div class="card-b" id="rm"><p class="empty">Memuat…</p></div></div>
  <div id="site"></div>
</main>
<script src="common.js?v=66c6dae5"></script><script src="ui.js?v=4a9b38dc"></script><script src="dashboard.js?v=bf1fabed"></script></body></html>
