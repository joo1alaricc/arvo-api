<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>.gbtn{position:relative;height:40px;border-radius:12px;isolation:isolate}.gface{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;pointer-events:none}.gface svg{width:18px;height:18px;flex:none}.gov{position:absolute;inset:0;z-index:2;overflow:hidden;opacity:.004;cursor:pointer}
/* Kekuatan password + checklist + langkah OTP — khusus mode Daftar, tema ikut variabel situs (--ok/--bad/--line/dst), bukan tema vamx. */
.pwmeter{display:none;margin-top:2px}.pwmeter.show{display:block}
.pwmeter .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-bottom:5px}.pwmeter .row b{font-weight:700}
.pwmeter .bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden}.pwmeter .bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--bad);transition:width .25s,background-color .25s}
.pwchecks{display:none;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:9px;font-size:12px}.pwchecks.show{display:grid}
.pwchecks li{list-style:none;display:flex;align-items:center;gap:6px;color:var(--mut);transition:color .2s}.pwchecks li.ok{color:var(--ok)}
.pwchecks li svg{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.termsrow{display:none;align-items:flex-start;gap:9px;font-size:12.5px;line-height:1.5;color:var(--mut);margin-top:4px}.termsrow.show{display:flex}
.termsrow input{width:auto;margin:3px 0 0}
.otpstep{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.otpstep.show{display:block}
.otpstep input{letter-spacing:6px;font:600 18px 'JetBrains Mono',monospace;text-align:center}
.otpback{background:none;border:0;color:var(--mut);font:inherit;font-size:12.5px;cursor:pointer;padding:0;margin-top:8px;text-decoration:underline}
.userstep{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.userstep.show{display:block}
.uhint{font-size:12px;margin-top:5px;min-height:15px}.uhint.ok{color:var(--ok)}.uhint.bad{color:var(--bad)}
</style><link rel="stylesheet" href="site.css?v=a2e3a1e8"><link rel="stylesheet" href="motion.css?v=79935f3d"></head>
<body><main class="wrap"><div class="panel auth">
  <div class="tabs"><button class="on" data-m="login">Masuk</button><button data-m="register">Daftar</button></div>
  <form id="f" style="margin-top:16px">
    <input id="u" placeholder="Username atau email" autocomplete="username" required>
    <input id="e" type="email" placeholder="Email" autocomplete="email" hidden>
    <input id="p" type="password" placeholder="Password (min. 8 karakter)" autocomplete="current-password" required>
    <div class="pwmeter" id="pwmeter"><div class="row"><span>Kekuatan Password:</span><b id="pwlabel"></b></div><div class="bar"><i id="pwbar"></i></div></div>
    <ul class="pwchecks" id="pwchecks">
      <li data-k="len"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg> Min. 8 karakter</li>
      <li data-k="low"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg> Huruf kecil (a-z)</li>
      <li data-k="up"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg> Huruf besar (A-Z)</li>
      <li data-k="num"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg> Angka (0-9)</li>
      <li data-k="sym"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg> Simbol (!@#$%^&amp;*)</li>
    </ul>
    <label class="termsrow" id="termsrow"><input type="checkbox" id="terms"> <span>Saya menyetujui Ketentuan Layanan dan Kebijakan Privasi Arvo API.</span></label>
    <button class="btn" id="go">Masuk</button>
    <label id="admrow" style="display:flex;align-items:center;gap:8px;font-size:13px;margin-top:10px;cursor:pointer"><input type="checkbox" id="adm" style="width:auto;margin:0"> Login sebagai Pengelola</label>
  </form>
  <div class="otpstep" id="otpstep">
    <label style="font-size:13px;font-weight:600">Kode verifikasi</label>
    <p class="msg" style="margin:2px 0 8px" id="otphint"></p>
    <input id="otpcode" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code">
    <button class="btn" id="otpgo" style="margin-top:9px;width:100%">Verifikasi</button>
    <button type="button" class="otpback" id="otpback">Ubah email / kirim ulang kode</button>
  </div>
  <div class="userstep" id="userstep">
    <label style="font-size:13px;font-weight:600">Pilih username</label>
    <input id="reguser" placeholder="Username (3-20 karakter)" autocomplete="username" style="margin-top:7px">
    <p class="uhint" id="uhint"></p>
    <button class="btn" id="usergo" style="margin-top:4px;width:100%">Buat Akun</button>
  </div>
  <p class="msg" id="m"></p>
  <div id="gwrapbox"><div id="gwrap" hidden><div class="sep">atau</div>
    <div class="gbtn" id="gb"><span class="gface" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;flex:none"><path fill="#4285F4" d="M22 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.6a4.8 4.8 0 0 1-2.1 3.1v2.6h3.4c2-1.8 3.1-4.5 3.1-7.5z"/><path fill="#34A853" d="M12 22c2.8 0 5.2-.9 6.9-2.5l-3.4-2.6c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.8-4.3H2.7v2.7A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.2 13.6a6 6 0 0 1 0-3.8V7.1H2.7a10 10 0 0 0 0 9z"/><path fill="#EA4335" d="M12 6.1c1.5 0 2.8.5 3.9 1.5l2.9-2.9A10 10 0 0 0 2.7 7.1l3.5 2.7C7 7.9 9.3 6.1 12 6.1z"/></svg><span>Lanjutkan dengan Google</span></span><div class="gov" id="gbtn"></div></div></div></div>
</div></main>
<script src="common.js?v=cp2"></script>
<script>
const qs = new URLSearchParams(location.search)
/* tujuan setelah login; disimpan di sessionStorage karena login Google memantul lewat halaman Google */
const nx = qs.get('next') || sessionStorage.getItem('arvo_next')
const dest = nx && nx.startsWith('/') && !nx.startsWith('//') ? nx : '/profile.html'
if (qs.get('next')) sessionStorage.setItem('arvo_next', dest)
let mode = 'login'
ready.then(({ user, who }) => { if (user) { sessionStorage.removeItem('arvo_next'); location.href = qs.get('as') === 'admin' && who && who.is_admin ? '/admin.html' : dest } })
if (qs.get('err') === 'google') say($('#m'), 'Masuk dengan Google gagal. Coba lagi.', 1)
/* Login sebagai Pengelola: hanya "Masuk", input Email + Access Key (tanpa password). Berhasil = masuk ke dashboard admin. */
const isAdm = () => $('#adm').checked
const admUi = () => {
  const a = isAdm()
  if (a) { mode = 'login'; document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x.dataset.m === 'login')); $('#e').hidden = true; $('#go').textContent = 'Masuk' }
  document.querySelector('.tabs [data-m="register"]').disabled = a
  $('#u').placeholder = a ? 'Email' : 'Username atau email'; $('#u').type = a ? 'email' : 'text'; $('#u').autocomplete = a ? 'email' : 'username'
  $('#p').placeholder = a ? 'Access Key' : 'Password (min. 8 karakter)'; $('#p').autocomplete = a ? 'off' : mode === 'login' ? 'current-password' : 'new-password'
  $('#gwrapbox').style.display = a ? 'none' : ''
  const reg = mode === 'register' && !a
  /* Mode Daftar: cukup Email + Password, username ditanya belakangan (langkah ke-3) biar gak dobel sama field Email. */
  $('#u').hidden = reg; $('#u').required = !reg
  $('#pwmeter').classList.toggle('show', reg); $('#pwchecks').classList.toggle('show', reg); $('#termsrow').classList.toggle('show', reg)
  if (!reg) pwUi()
}
/* Kekuatan password + checklist (register saja). Skor dari 5 aturan -> warna & label. */
const PW_RULES = { len: (v) => v.length >= 8, low: (v) => /[a-z]/.test(v), up: (v) => /[A-Z]/.test(v), num: (v) => /[0-9]/.test(v), sym: (v) => /[^A-Za-z0-9]/.test(v) }
const PW_LABELS = ['Sangat Lemah', 'Lemah', 'Cukup', 'Kuat', 'Sangat Kuat & Aman']
const pwUi = () => {
  const v = $('#p').value, hits = Object.entries(PW_RULES).map(([k, f]) => [k, f(v)])
  const score = hits.filter(([, ok]) => ok).length
  hits.forEach(([k, ok]) => $(`#pwchecks li[data-k="${k}"]`).classList.toggle('ok', ok))
  const pct = v ? Math.max(14, (score / 5) * 100) : 0
  $('#pwbar').style.width = pct + '%'
  $('#pwbar').style.background = !v ? 'var(--line)' : score <= 2 ? 'var(--bad)' : score === 3 ? '#e0a63e' : score === 4 ? '#3ecf8e' : 'var(--ok)'
  $('#pwlabel').textContent = v ? PW_LABELS[Math.max(0, score - 1)] : ''
}
$('#p').addEventListener('input', pwUi)
/* Langkah daftar: 'form' (email+password) -> 'otp' (kode dari email) -> 'user' (pilih username, baru akun dibuat). */
let step = 'form', otpToken = null, otpEmail = null, verifiedToken = null
const stepUi = () => {
  $('#f').hidden = step !== 'form'
  $('#otpstep').classList.toggle('show', step === 'otp')
  $('#userstep').classList.toggle('show', step === 'user')
  if (step === 'otp') $('#otphint').textContent = `Kode dikirim ke ${otpEmail}. Berlaku 10 menit.`
  if (step === 'user') { $('#reguser').value = ''; $('#uhint').textContent = ''; $('#uhint').className = 'uhint'; $('#usergo').disabled = true; setTimeout(() => $('#reguser').focus(), 50) }
}
$('#otpback').onclick = () => { step = 'form'; otpToken = null; stepUi(); say($('#m'), '') }
document.querySelectorAll('.tabs button').forEach((b) => (b.onclick = () => {
  if (isAdm() && b.dataset.m !== 'login') return
  mode = b.dataset.m; step = 'form'; otpToken = null; verifiedToken = null; stepUi()
  document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b))
  $('#e').hidden = mode !== 'register'; $('#e').required = mode === 'register'; $('#go').textContent = mode === 'login' ? 'Masuk' : 'Kirim Kode OTP'
  $('#admrow').hidden = mode !== 'login'; if (mode !== 'login') $('#adm').checked = false; admUi(); say($('#m'), '')
}))
$('#adm').onchange = admUi
if (qs.get('as') === 'admin') { $('#adm').checked = true; admUi() }
$('#f').onsubmit = async (ev) => {
  ev.preventDefault()
  const b = $('#go'); b.disabled = true
  try {
    if (isAdm()) { await put('/auth/admin-login', { email: $('#u').value, access_key: $('#p').value }, 'POST'); location.href = '/admin.html'; return }
    if (mode === 'login') { await put('/auth/login', { username: $('#u').value, password: $('#p').value }, 'POST'); location.href = dest; return }
    /* Daftar: validasi ringan dulu, lalu minta kode OTP ke email yang diisi. */
    if (!$('#terms').checked) throw new Error('Setujui Ketentuan Layanan dan Kebijakan Privasi dulu ya.')
    if ($('#p').value.length < 8) throw new Error('Password minimal 8 karakter.')
    const r = await put('/auth/send-otp', { email: $('#e').value }, 'POST')
    otpToken = r.otp_token; otpEmail = $('#e').value.trim()
    step = 'otp'; stepUi(); say($('#m'), '')
  } catch (e) { say($('#m'), e.message, 1) }
  b.disabled = false
}
$('#otpgo').onclick = async () => {
  const b = $('#otpgo'); b.disabled = true
  try {
    const r = await put('/auth/verify-otp', { email: otpEmail, code: $('#otpcode').value.trim(), otp_token: otpToken }, 'POST')
    verifiedToken = r.verified_token
    step = 'user'; stepUi(); say($('#m'), '')
  } catch (e) { say($('#m'), e.message, 1) }
  b.disabled = false
}
/* Cek ketersediaan username sambil ngetik (debounce), biar gak nabrak punya orang lain. */
let uTimer = null
$('#reguser').addEventListener('input', () => {
  const v = $('#reguser').value.trim(), hint = $('#uhint')
  clearTimeout(uTimer); $('#usergo').disabled = true
  if (!v) { hint.textContent = ''; hint.className = 'uhint'; return }
  if (!/^[A-Za-z0-9_]{3,20}$/.test(v)) { hint.textContent = 'Username 3-20 karakter: huruf, angka, atau _'; hint.className = 'uhint bad'; return }
  hint.textContent = 'Mengecek…'; hint.className = 'uhint'
  uTimer = setTimeout(async () => {
    try {
      const r = await api('/auth/check-username?u=' + encodeURIComponent(v))
      if ($('#reguser').value.trim() !== v) return
      hint.textContent = r.available ? 'Username tersedia' : 'Username sudah dipakai'
      hint.className = 'uhint ' + (r.available ? 'ok' : 'bad')
      $('#usergo').disabled = !r.available
    } catch { hint.textContent = ''; hint.className = 'uhint' }
  }, 400)
})
$('#usergo').onclick = async () => {
  const b = $('#usergo'); b.disabled = true
  try {
    await put('/auth/register', { username: $('#reguser').value.trim(), password: $('#p').value, email: otpEmail, verified_token: verifiedToken }, 'POST')
    location.href = dest
  } catch (e) { say($('#m'), e.message, 1); b.disabled = false }
}
/* Google: mode redirect. Tombol membawa kamu ke Google lalu kembali ke /api/auth/google/callback,
   tanpa popup. Di Google Cloud Console daftarkan origin situs ini dan URI callback tersebut. */
api('/auth/config').then(({ google_client_id }) => {
  if (!google_client_id) return
  const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true
  s.onload = () => {
    google.accounts.id.initialize({ client_id: google_client_id, ux_mode: 'redirect', login_uri: location.origin + '/api/auth/google/callback', auto_select: false })
    /* Tombol asli Google dirender transparan tepat di atas tombol buatan kita: tampilannya ikut tema Arvo, kliknya tetap resmi dari Google. */
    $('#gwrap').hidden = false
    const w = Math.min(400, Math.max(200, Math.round($('#gb').getBoundingClientRect().width)))
    google.accounts.id.renderButton($('#gbtn'), { theme: 'outline', size: 'large', shape: 'rectangular', width: w, text: 'continue_with' })
  }
  document.head.append(s)
}).catch(() => {})
</script></body></html>
