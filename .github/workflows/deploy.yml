# Deploy otomatis ke Cloudflare setiap ada commit ke main (termasuk commit dari dashboard admin).
# Butuh secret repo: CLOUDFLARE_API_TOKEN dan CLOUDFLARE_ACCOUNT_ID.
# Kalau kamu sudah memakai Cloudflare Workers Builds (Connect to Git), HAPUS file ini.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
# Dashboard commit file satu per satu; run lama dibatalkan, jadi yang benar-benar di-deploy
# adalah commit terakhir (file "main").
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
