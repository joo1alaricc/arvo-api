name = "arvo-api"
main = "src/index.js"
compatibility_date = "2026-11-15"

# Kunci tingkat-atas HARUS di atas tabel pertama ([assets], [vars], dst).
# Kalau ditaruh di bawah tabel, TOML menganggapnya milik tabel itu dan wrangler mengabaikannya.
routes = [{ pattern = "arvo-api.my.id", custom_domain = true }, { pattern = "cloud.arvo-api.my.id", custom_domain = true }]   # baris ke-2 = domain CDN Uploader (hapus + kosongkan CDN_BASE kalau tidak mau)
keep_vars = true   # jangan hapus variabel yang diisi lewat dashboard saat deploy

# Jalan otomatis tiap `wrangler deploy`/`dev`: isi ?v=hash di HTML. Wajib karena file ber-?v= di-cache browser 1 tahun (anti-lambat);
# kalau isi file berubah, hash ikut berubah, jadi pengguna selalu dapat versi terbaru.
[build]
command = "node scripts/seo-head.mjs && node scripts/bump-version.mjs"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"
# Halaman statis dijawab langsung oleh Cloudflare (CSS/JS/gambar selalu termuat). Worker hanya didahulukan untuk halaman layanan
# yang bisa dimatikan admin (/smm, /otp, /am, /netflix, /pterodactyl): kalau dimatikan, tampil 404.
run_worker_first = ["/smm", "/smm/", "/smm.html", "/otp", "/otp/", "/otp.html", "/am", "/am/", "/am.html", "/netflix", "/netflix/", "/netflix.html", "/pterodactyl", "/pterodactyl/", "/pterodactyl.html"]

[vars]
API_NAME = "Arvo"
API_VERSION = "1.0.0"
RATE_LIMIT_WINDOW_MS = "900000"
RATE_LIMIT_MAX = "100"
RATE_LIMIT_WHITELIST = "127.0.0.1"
RATE_LIMIT_BAN_LIST = ""
HERO_VIDEO ="https://cloud.yardansh.com/2yf0iQ.mp4"
HERO_POSTER = ""
OTP_MARKUP_PCT = "15"    # markup persen, mis. "10" = +10%
OTP_MARKUP_FLAT = "500"
ADMIN_EMAILS = "rizaladitia992@gmail.com, ryydigitalstore@gmail.com"
# Repo tujuan, format "pemilik/nama-repo". Contoh: "yardansh/arvo-api"
GITHUB_REPO = "joo1alaricc/arvo-api"
GITHUB_BRANCH = "main"
# IP owner (pisah koma): tanpa limit + akses panel admin. Isi IP publik kamu!
OWNER_IPS = "103.150.16.3,2400:9800:265:7f87:18e8:67d6:e897:74ad,2400:9800:20c:c155:18e8:8704:c378:90cc"
QRIS_IMAGE_URL = "https://cloud.yardansh.com/EhofMy.jpg"
ORDER_TTL_MIN = "30"
# Uploader (Tools): domain publik file (tanpa garis miring akhir). Harus sama dengan routes di atas. Kosong = pakai /f/<file> di domain utama.
CDN_BASE = "https://cloud.arvo-api.my.id"
UPLOAD_MAX_MB = "25"      # maks ukuran per file (batas KV: 25 MB)
UPLOAD_MAX_FILES = "200"  # maks jumlah file aktif per user
UPLOAD_MAX_TOTAL_MB = "200"  # maks total ukuran file aktif per user (KV gratis total 1 GB untuk semua user)
FREE_DAILY_LIMIT = "100"
# OWNER_ACCESS_KEY JANGAN ditulis di sini (file ini ikut ke GitHub). Isi lewat: npx wrangler secret put OWNER_ACCESS_KEY (pakai kunci panjang & acak)
GOOGLE_CLIENT_ID = "978603752308-2crtqbtdjangppler9i9qf70bmvchacn.apps.googleusercontent.com"
# Anti-bot Cloudflare Turnstile (opsional, sangat disarankan): buat widget di dash.cloudflare.com > Turnstile, isi site key di bawah (publik),
# lalu `npx wrangler secret put TURNSTILE_SECRET`. Kosong = fitur mati, login/daftar tetap jalan seperti biasa.
TURNSTILE_SITE_KEY = ""
# Secret (wrangler secret put, JANGAN ditulis di file ini): VAMX_API_KEY, GITHUB_API, PAYMENT_WEBHOOK_SECRET, dan opsional QRIS_STATIC
# Secret BTZPay (deposit): BTZPAY_APIKEY, BTZPAY_CALLBACK_TOKEN, dan opsional BTZPAY_SANDBOX_APIKEY. Opsional di [vars]: BTZPAY_BASE_URL (default https://web.btzpay.my.id)

# Cron Panel Pterodactyl: tiap 15 menit suspend server yang habis masa aktif, hapus yang lewat masa tenggang, ulangi pembuatan server yang gagal.
[triggers]
crons = ["*/15 * * * *"]

# Waktu deploy versi aktif, dipakai untuk "Server Uptime" di Dashboard.
[version_metadata]
binding = "CF_VERSION_METADATA"

# KV untuk Uploader (gratis, tanpa kartu). Buat namespace: npx wrangler kv namespace create UPLOADS, lalu tempel id-nya di bawah.
[[kv_namespaces]]
binding = "UPLOADS"
id = "4eed98ac8a45499aa24a36bbf4a90724q"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimitDO"

[[durable_objects.bindings]]
name = "STORE"
class_name = "StoreDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimitDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["StoreDO"]
