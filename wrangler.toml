name = "arvo-api"
main = "src/index.js"
compatibility_date = "2026-11-15"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

[vars]
API_NAME = "YeMo"
API_VERSION = "1.0.0"
RATE_LIMIT_WINDOW_MS = "900000"
RATE_LIMIT_MAX = "100"
RATE_LIMIT_WHITELIST = "127.0.0.1"
RATE_LIMIT_BAN_LIST = ""

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimitDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimitDO"]
